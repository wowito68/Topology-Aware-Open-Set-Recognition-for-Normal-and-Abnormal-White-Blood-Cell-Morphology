name: mll23_closed_set
task: closed_set
seed: 13
device: auto
precision: amp
dataset: mll23
image_size: 224
batch_size: 32
num_workers: 4
backbone: resnet18
pretrained: true
optimizer: adamw
learning_rate: 0.001
weight_decay: 0.0001
epochs: 30
early_stopping:
  patience: 5
scheduler:
  name: cosine
augmentation:
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.0
  rotation_degrees: 10.0
  brightness: 0.05
  contrast: 0.05
known_classes:
  - basophil
  - eosinophil
  - lymphocyte
  - monocyte
  - neutrophil_segmented
unknown_classes: []
open_set_method: null
tda: null
output_dir: artifacts/checkpoints/mll23_closed_set

